name: BetterDependabot

on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: latest
          runtime: node@22
          install: false

      - name: Update [root]
        run: |
          cd ${{ github.workspace }}
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm update --latest --ignore-scripts
        continue-on-error: true

      - name: Update [research]
        run: |
          cd ${{ github.workspace }}/research
          pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace
          pnpm update --latest --ignore-scripts --ignore-workspace
        continue-on-error: true

      - name: Update [tests]
        run: |
          cd ${{ github.workspace }}/src/tests
          pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace
          pnpm update --latest --ignore-scripts --ignore-workspace
        continue-on-error: true

      - name: Update [patcher]
        run: |
          cd ${{ github.workspace }}/patcher
          pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace
          pnpm update --latest --ignore-scripts --ignore-workspace
        continue-on-error: true

      - name: Update [lib]
        run: |
          cd ${{ github.workspace }}/src/lib
          pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace
          pnpm update --latest --ignore-scripts --ignore-workspace
        continue-on-error: true

      - name: Update [patcher/tests]
        run: |
          cd ${{ github.workspace }}/patcher/tests
          pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace
          pnpm update --latest --ignore-scripts --ignore-workspace
        continue-on-error: true

      - name: Update [website]
        run: |
          cd ${{ github.workspace }}/website
          pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace
          pnpm update --latest --ignore-scripts --ignore-workspace
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update dependencies" || echo "No changes"

      - name: Push changes
        run: git push origin HEAD:${{ github.ref }}
